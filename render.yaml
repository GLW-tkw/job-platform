services:
  - type: web
    name: job-platform
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_DIR
        value: /tmp
      - key: UPLOADS_DIR
        value: /tmp/uploads
